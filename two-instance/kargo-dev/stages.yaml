apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: kargo-2i-dev
  annotations:
    kargo.akuity.io/color: red
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: guestbook
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - task:
          name: deploy-direct
  verification:
    analysisTemplates:
    - name: smoke-test
    args:
    - name: namespace
      value: guestbook-simple-dev

---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev-handoff
  namespace: kargo-2i-dev
spec:
  # Deploys nothing. Records dev-verified Freight on 2i/handoff/dev, which is
  # all the release Kargo can see. Handing off the same Freight twice changes
  # nothing, so it creates no commit and no release Freight.
  requestedFreight:
  - origin:
      kind: Warehouse
      name: guestbook
    sources:
      stages:
      - dev
  promotionTemplate:
    spec:
      vars:
      - name: repoURL
        value: https://github.com/kwu-qf/kargo-simple.git
      - name: image
        value: ghcr.io/kwu-qf/guestbook
      steps:
      - uses: git-clone
        config:
          repoURL: ${{ vars.repoURL }}
          checkout:
          - commit: ${{ commitFrom(vars.repoURL).ID }}
            path: ./src
          - branch: 2i/handoff/dev
            create: true
            path: ./handoff
      # Start from the template so every key exists, then fill all of them.
      - uses: copy
        config:
          inPath: ./src/two-instance/handoff/release.yaml
          outPath: ./handoff/release.yaml
      - uses: yaml-update
        config:
          path: ./handoff/release.yaml
          updates:
          - key: devFreight
            value: ${{ ctx.targetFreight.name }}
          - key: devAlias
            value: ${{ ctx.targetFreight.alias }}
          - key: image
            value: ${{ vars.image }}
          - key: tag
            value: ${{ imageFrom(vars.image).Tag }}
          - key: digest
            value: ${{ imageFrom(vars.image).Digest }}
          - key: configCommit
            value: ${{ commitFrom(vars.repoURL).ID }}
      - uses: git-commit
        config:
          path: ./handoff
          message: "dev verified: guestbook ${{ imageFrom(vars.image).Tag }} @ ${{ commitFrom(vars.repoURL).ID }} (${{ ctx.targetFreight.alias }})"
      - uses: git-push
        config:
          path: ./handoff
