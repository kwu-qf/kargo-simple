apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Apply to cluster kargo-2i-dev (kubectl --context kind-kargo-2i-dev).
  name: kargo-2i-dev
  namespace: argocd
  annotations:
    # Lets the Kargo Stage "dev" in Project "kargo-2i-dev" update and sync this app.
    kargo.akuity.io/authorized-stage: kargo-2i-dev:dev
spec:
  project: default
  source:
    repoURL: https://github.com/kwu-qf/kargo-simple.git
    # Rendered YAML pushed by Kargo; created on the first deploy to dev.
    targetRevision: 2i/stage/dev
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: guestbook-simple-dev
  # No automated sync: only Kargo's argocd-update deploys, after the record check.
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
