apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-simple
  namespace: guestbook-simple-prod
spec:
  replicas: 4
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: guestbook-simple
  template:
    metadata:
      labels:
        app: guestbook-simple
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: guestbook-simple
        image: ghcr.io/kwu-qf/guestbook:v0.0.5
        livenessProbe:
          httpGet:
            path: /info
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        name: guestbook-simple
        ports:
        - containerPort: 3000
          name: http
        readinessProbe:
          httpGet:
            path: /info
            port: http
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
      imagePullSecrets:
      - name: ghcr-pull
