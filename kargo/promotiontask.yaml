apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: promote
  namespace: kargo-simple
spec:
  vars:
  - name: repoURL
    value: https://github.com/kwu-qf/kargo-simple.git
  - name: image
    value: ghcr.io/kwu-qf/guestbook
  # "true": record the promotion in versions/<stage>.yaml via a PR on main and
  # deploy only after it merges. "false": deploy directly (dev).
  - name: approval
    value: "false"
  steps:
  # Check out the Freight's commit of main (never the latest main), the
  # rendered branch stage/<stage>, and main itself for the version record.
  - uses: git-clone
    config:
      repoURL: ${{ vars.repoURL }}
      checkout:
      - commit: ${{ commitFrom(vars.repoURL).ID }}
        path: ./src
      - branch: stage/${{ ctx.stage }}
        create: true
        path: ./out
      - branch: main
        path: ./main
  - uses: git-clear
    config:
      path: ./out
  # Set the image tag locally only; it is never committed to main.
  - uses: kustomize-set-image
    config:
      path: ./src/stages/${{ ctx.stage }}
      images:
      - image: ${{ vars.image }}
        tag: ${{ imageFrom(vars.image).Tag }}
  - uses: kustomize-build
    config:
      path: ./src/stages/${{ ctx.stage }}
      outPath: ./out

  # --- approval gate: one PR on main changing versions/<stage>.yaml ---------
  # Read the previously approved record before it is overwritten, so the PR
  # can link to the config diff between the old and new configCommit.
  - uses: yaml-parse
    if: ${{ vars.approval == 'true' }}
    as: prev
    config:
      path: ./main/versions/${{ ctx.stage }}.yaml
      outputs:
      - name: tag
        fromExpression: tag
      - name: configCommit
        fromExpression: configCommit
  - uses: yaml-update
    if: ${{ vars.approval == 'true' }}
    config:
      path: ./main/versions/${{ ctx.stage }}.yaml
      updates:
      - key: freight
        value: ${{ ctx.targetFreight.name }}
      - key: image
        value: ${{ vars.image }}
      - key: tag
        value: ${{ imageFrom(vars.image).Tag }}
      - key: configCommit
        value: ${{ commitFrom(vars.repoURL).ID }}
  - uses: git-commit
    if: ${{ vars.approval == 'true' }}
    config:
      path: ./main
      message: "[${{ ctx.stage }}] promote ${{ imageFrom(vars.image).Tag }} @ ${{ commitFrom(vars.repoURL).ID }}"
  - uses: git-push
    if: ${{ vars.approval == 'true' }}
    as: pushRecord
    config:
      path: ./main
      generateTargetBranch: true
  - uses: git-open-pr
    if: ${{ vars.approval == 'true' }}
    as: openPR
    config:
      repoURL: ${{ vars.repoURL }}
      sourceBranch: ${{ task.outputs.pushRecord.branch }}
      targetBranch: main
      title: "Promote to ${{ ctx.stage }}: ${{ imageFrom(vars.image).Tag }}"
      # On the first promotion versions/<stage>.yaml is empty: no diff to link.
      description: |
        Freight: `${{ ctx.targetFreight.name }}`

        Image: `${{ task.outputs.prev.tag == '' ? '(none)' : task.outputs.prev.tag }}` → `${{ imageFrom(vars.image).Tag }}`

        Config diff: ${{ task.outputs.prev.configCommit == '' ? '(first promotion, nothing to compare)' : trimSuffix(vars.repoURL, '.git') + '/compare/' + task.outputs.prev.configCommit + '...' + commitFrom(vars.repoURL).ID }}
  # A rejected or closed PR fails the Promotion here: nothing is pushed or deployed.
  - uses: git-wait-for-pr
    if: ${{ vars.approval == 'true' }}
    config:
      repoURL: ${{ vars.repoURL }}
      prNumber: ${{ task.outputs.openPR.pr.id }}
      # How often Kargo checks whether the PR was merged (default 30s, minimum 10s).
      # A GitHub webhook (pull_request closed) makes it immediate.
      pollInterval: 10s

  # --- deploy: push rendered YAML to stage/<stage> -----------------------------
  - uses: git-commit
    as: commit
    config:
      path: ./out
      message: "[${{ ctx.stage }}] ${{ imageFrom(vars.image).Tag }} @ ${{ commitFrom(vars.repoURL).ID }}"
  - uses: git-push
    config:
      path: ./out

  # Sync the Argo CD Application for this Stage to the commit just pushed.
  - uses: argocd-update
    config:
      apps:
      - name: kargo-simple-${{ ctx.stage }}
        sources:
        - repoURL: ${{ vars.repoURL }}
          desiredRevision: ${{ task.outputs.commit.commit }}
