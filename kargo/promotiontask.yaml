apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: promote
  namespace: kargo-simple
spec:
  vars:
  - name: repoURL
    value: https://github.com/kwu-qf/kargo-simple.git
  - name: image
    value: ghcr.io/kwu-qf/guestbook
  # "true": record the promotion in versions/<stage>.yaml via a PR on main and
  # deploy only after it merges. "false": deploy directly (dev).
  - name: approval
    value: "false"
  steps:
  # Check out the Freight's commit of main (never the latest main), the
  # rendered branch stage/<stage>, and main itself for the version record.
  - uses: git-clone
    config:
      repoURL: ${{ vars.repoURL }}
      checkout:
      - commit: ${{ commitFrom(vars.repoURL).ID }}
        path: ./src
      - branch: stage/${{ ctx.stage }}
        create: true
        path: ./out
      - branch: main
        path: ./main
  - uses: git-clear
    config:
      path: ./out
  # Set the image tag locally only; it is never committed to main.
  - uses: kustomize-set-image
    config:
      path: ./src/stages/${{ ctx.stage }}
      images:
      - image: ${{ vars.image }}
        tag: ${{ imageFrom(vars.image).Tag }}
  - uses: kustomize-build
    config:
      path: ./src/stages/${{ ctx.stage }}
      outPath: ./out

  # --- approval gate: one PR on main changing versions/<stage>.yaml ---------
  # Release train version at the Freight's commit (people bump it via PR).
  - uses: yaml-parse
    if: ${{ vars.approval == 'true' }}
    as: release
    config:
      path: ./src/release/version.yaml
      outputs:
      - name: version
        fromExpression: version
  # Read the previously approved record before it is overwritten, so the PR
  # can link to the config diff between the old and new configCommit.
  - uses: yaml-parse
    if: ${{ vars.approval == 'true' }}
    as: prev
    config:
      path: ./main/versions/${{ ctx.stage }}.yaml
      outputs:
      - name: version
        fromExpression: version
      - name: tag
        fromExpression: images.guestbook.tag
      - name: configCommit
        fromExpression: configCommit
  # rcTag and releaseTag are the names the tag Stages will create for this
  # Freight (rc after staging verification, rel after prod verification).
  # Keep these formats in sync with staging-rc and prod-release in kargo/stages.yaml.
  - uses: yaml-update
    if: ${{ vars.approval == 'true' }}
    config:
      path: ./main/versions/${{ ctx.stage }}.yaml
      updates:
      - key: freight
        value: ${{ ctx.targetFreight.name }}
      - key: version
        value: ${{ task.outputs.release.version }}
      - key: configCommit
        value: ${{ commitFrom(vars.repoURL).ID }}
      - key: images.guestbook.image
        value: ${{ vars.image }}
      - key: images.guestbook.tag
        value: ${{ imageFrom(vars.image).Tag }}
      - key: rcTag
        value: rc-${{ task.outputs.release.version }}-${{ commitFrom(vars.repoURL).ID[0:7] }}-${{ ctx.targetFreight.alias }}-${{ ctx.targetFreight.name[0:7] }}
  - uses: yaml-update
    if: ${{ vars.approval == 'true' && ctx.stage == 'prod' }}
    config:
      path: ./main/versions/${{ ctx.stage }}.yaml
      updates:
      - key: releaseTag
        value: rel-${{ task.outputs.release.version }}-${{ ctx.targetFreight.name[0:7] }}
  - uses: git-commit
    if: ${{ vars.approval == 'true' }}
    config:
      path: ./main
      message: "[${{ ctx.stage }}] promote ${{ task.outputs.release.version }}: guestbook ${{ imageFrom(vars.image).Tag }} @ ${{ commitFrom(vars.repoURL).ID }}"
  - uses: git-push
    if: ${{ vars.approval == 'true' }}
    as: pushRecord
    config:
      path: ./main
      generateTargetBranch: true
  - uses: git-open-pr
    if: ${{ vars.approval == 'true' }}
    as: openPR
    config:
      repoURL: ${{ vars.repoURL }}
      sourceBranch: ${{ task.outputs.pushRecord.branch }}
      targetBranch: main
      title: "Promote ${{ task.outputs.release.version }} to ${{ ctx.stage }}: guestbook ${{ imageFrom(vars.image).Tag }}"
      # On the first promotion versions/<stage>.yaml is empty: no diff to link.
      description: |
        Freight: `${{ ctx.targetFreight.name }}`

        Version: `${{ task.outputs.prev.version == '' ? '(none)' : task.outputs.prev.version }}` → `${{ task.outputs.release.version }}`

        guestbook: `${{ task.outputs.prev.tag == '' ? '(none)' : task.outputs.prev.tag }}` → `${{ imageFrom(vars.image).Tag }}`

        Config diff: ${{ task.outputs.prev.configCommit == '' ? '(first promotion, nothing to compare)' : trimSuffix(vars.repoURL, '.git') + '/compare/' + task.outputs.prev.configCommit + '...' + commitFrom(vars.repoURL).ID }}

        RC tag: `rc-${{ task.outputs.release.version }}-${{ commitFrom(vars.repoURL).ID[0:7] }}-${{ ctx.targetFreight.alias }}-${{ ctx.targetFreight.name[0:7] }}`${{ ctx.stage == 'prod' ? '' : ' (created after staging verification)' }}

        Release tag: ${{ ctx.stage == 'prod' ? '`rel-' + task.outputs.release.version + '-' + ctx.targetFreight.name[0:7] + '` (created after prod verification)' : '(set by the prod promotion)' }}
  # A rejected or closed PR fails the Promotion here: nothing is pushed or deployed.
  # git-open-pr is skipped (no output) when versions/<stage>.yaml on main already
  # records this Freight, e.g. re-promoting the current Freight or retrying after
  # the PR merged. That record was approved already, so deploy without waiting.
  - uses: git-wait-for-pr
    if: ${{ vars.approval == 'true' && task.outputs.openPR?.pr?.id != nil }}
    config:
      repoURL: ${{ vars.repoURL }}
      prNumber: ${{ task.outputs.openPR.pr.id }}
      # How often Kargo checks whether the PR was merged (default 30s, minimum 10s).
      # A GitHub webhook (pull_request closed) makes it immediate.
      pollInterval: 10s

  # --- deploy: push rendered YAML to stage/<stage> -----------------------------
  - uses: git-commit
    as: commit
    config:
      path: ./out
      message: "[${{ ctx.stage }}] ${{ imageFrom(vars.image).Tag }} @ ${{ commitFrom(vars.repoURL).ID }}"
  - uses: git-push
    config:
      path: ./out

  # Sync the Argo CD Application for this Stage to the commit just pushed.
  - uses: argocd-update
    config:
      apps:
      - name: kargo-simple-${{ ctx.stage }}
        sources:
        - repoURL: ${{ vars.repoURL }}
          desiredRevision: ${{ task.outputs.commit.commit }}
