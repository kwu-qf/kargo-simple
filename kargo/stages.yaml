apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: kargo-simple
  annotations:
    kargo.akuity.io/color: red
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: guestbook
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - task:
          name: promote
  # Smoke test after deploy. Only Freight that passes is verified and can
  # move to the next Stage.
  verification:
    analysisTemplates:
    - name: smoke-test
    args:
    - name: namespace
      value: guestbook-simple-dev

---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: kargo-simple
  annotations:
    kargo.akuity.io/color: amber
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: guestbook
    sources:
      stages:
      - dev
  promotionTemplate:
    spec:
      steps:
      - task:
          name: promote
        vars:
        - name: approval
          value: "true"
  # Smoke test after deploy. Only Freight that passes is verified and can
  # move to the next Stage.
  verification:
    analysisTemplates:
    - name: smoke-test
    args:
    - name: namespace
      value: guestbook-simple-staging

---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: kargo-simple
  annotations:
    kargo.akuity.io/color: violet
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: guestbook
    sources:
      stages:
      - staging
  promotionTemplate:
    spec:
      steps:
      - task:
          name: promote
        vars:
        - name: approval
          value: "true"
  # Smoke test after deploy. Only Freight that passes is verified and can
  # move to the next Stage.
  verification:
    analysisTemplates:
    - name: smoke-test
    args:
    - name: namespace
      value: guestbook-simple-prod

---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod-release
  namespace: kargo-simple
  annotations:
    kargo.akuity.io/color: green
spec:
  # Freight becomes available here only after it passes prod verification.
  requestedFreight:
  - origin:
      kind: Warehouse
      name: guestbook
    sources:
      stages:
      - prod
  # Deploys nothing: tags the Freight's commit of main as a release.
  # The tag name includes the short SHA because the same image tag can ship
  # with different config.
  promotionTemplate:
    spec:
      vars:
      - name: repoURL
        value: https://github.com/kwu-qf/kargo-simple.git
      - name: image
        value: ghcr.io/kwu-qf/guestbook
      - name: releaseTag
        value: release-${{ imageFrom(vars.image).Tag }}-${{ commitFrom(vars.repoURL).ID[0:7] }}
      steps:
      - uses: git-clone
        config:
          repoURL: ${{ vars.repoURL }}
          checkout:
          - commit: ${{ commitFrom(vars.repoURL).ID }}
            path: ./src
      - uses: git-tag
        config:
          path: ./src
          tag: ${{ vars.releaseTag }}
          message: "prod verified: ${{ imageFrom(vars.image).Tag }} @ ${{ commitFrom(vars.repoURL).ID }} (Freight ${{ ctx.targetFreight.name }})"
      - uses: git-push
        config:
          path: ./src
          tag: ${{ vars.releaseTag }}
