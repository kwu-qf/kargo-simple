apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: kargo-simple
  annotations:
    kargo.akuity.io/color: red
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: guestbook
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - task:
          name: promote
  # Smoke test after deploy. Only Freight that passes is verified and can
  # move to the next Stage.
  verification:
    analysisTemplates:
    - name: smoke-test
    args:
    - name: namespace
      value: guestbook-simple-dev

---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: kargo-simple
  annotations:
    kargo.akuity.io/color: amber
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: guestbook
    sources:
      stages:
      - dev
  promotionTemplate:
    spec:
      steps:
      - task:
          name: promote
        vars:
        - name: approval
          value: "true"
  # Smoke test after deploy. Only Freight that passes is verified and can
  # move to the next Stage.
  verification:
    analysisTemplates:
    - name: smoke-test
    args:
    - name: namespace
      value: guestbook-simple-staging

---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: kargo-simple
  annotations:
    kargo.akuity.io/color: violet
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: guestbook
    sources:
      stages:
      - staging
  promotionTemplate:
    spec:
      steps:
      - task:
          name: promote
        vars:
        - name: approval
          value: "true"
  # Smoke test after deploy. Only Freight that passes is verified and can
  # move to the next Stage.
  verification:
    analysisTemplates:
    - name: smoke-test
    args:
    - name: namespace
      value: guestbook-simple-prod
