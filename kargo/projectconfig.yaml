apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  # Must have the same name as the Project and live in its namespace.
  name: kargo-simple
  namespace: kargo-simple
spec:
  promotionPolicies:
  # dev: every new Freight from the Warehouse is promoted and deployed automatically.
  - stageSelector:
      name: dev
    autoPromotionEnabled: true
  # staging: Freight that passes dev verification is promoted automatically.
  # The Promotion opens a PR on main (versions/staging.yaml) and deploys only
  # after that PR merges; closing the PR cancels it.
  - stageSelector:
      name: staging
    autoPromotionEnabled: true
  # prod is promoted by hand (same PR gate).
  # prod-release: Freight that passes prod verification is tagged automatically.
  - stageSelector:
      name: prod-release
    autoPromotionEnabled: true
