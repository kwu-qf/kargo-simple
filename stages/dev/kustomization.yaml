apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# dev: env-specific values only. Written by people, via PR.
# No image tag here: Kargo sets it at render time and pushes the result to stage/dev.

resources:
- ../../base

namespace: guestbook-simple-dev

replicas:
- name: guestbook-simple
  count: 1

patches:
- target: { kind: ConfigMap, name: guestbook-simple }
  patch: |-
    - op: replace
      path: /data/APP_ENV
      value: dev
    - op: replace
      path: /data/LOG_LEVEL
      value: debug
- target: { kind: Service, name: guestbook-simple }
  patch: |-
    # NodePort 32080 is mapped to localhost:32080 by the kind quickstart cluster
    - op: replace
      path: /spec/type
      value: NodePort
    - op: add
      path: /spec/ports/0/nodePort
      value: 32080
