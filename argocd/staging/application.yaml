apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-simple-staging
  namespace: argocd
  annotations:
    # Lets the Kargo Stage "staging" in Project "kargo-simple" update and sync this app.
    kargo.akuity.io/authorized-stage: kargo-simple:staging
spec:
  project: default
  source:
    repoURL: https://github.com/kwu-qf/kargo-simple.git
    # Rendered YAML pushed by Kargo; created on the first promotion to staging.
    targetRevision: stage/staging
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: guestbook-simple-staging
  # No automated sync: Kargo's argocd-update step syncs to the promoted commit.
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
